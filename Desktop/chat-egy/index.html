<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات إيجي - منصة النشر التفاعلية المفتوحة</title>
    <meta name="description" content="شارك أفكارك ومقالاتك بحرية على شات إيجي بدون تعقيدات التسجيل. مجتمع مفتوح للنقاش الهادف وتبادل الآراء.">
    <meta name="keywords" content="شات إيجي, مقالات, نشر حر, منصة تفاعلية, أخبار, مصر">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    
    <!-- PWA Links -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    
    <link rel="stylesheet" href="/css/portal.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-flex">
            <a href="/" class="logo">شات <span>إيجي</span></a>
            <p class="tagline">صوتك مسموع بدون قيود</p>
        </div>
    </header>

    <main class="container">
        <section class="post-creation">
            <form id="postForm">
                <div class="input-group">
                    <input type="text" id="authorName" placeholder="الاسم (إجباري)" required autocomplete="off">
                </div>
                <div class="input-group">
                    <textarea id="postContent" rows="4" placeholder="بم تفكر؟ شارك مقالك أو رأيك هنا..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">نشر التدوينة</button>
            </form>
        </section>

        <section class="feed">
            <div class="feed-header">
                <h2>أحدث المنشورات</h2>
            </div>
            <div id="postsContainer">
                <!-- سيتم حقن المنشورات هنا عبر الجافاسكريبت -->
            </div>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
